<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIWI待办</title>
<meta name="robots" content="noindex,nofollow">
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f4f7fb; color:#243247; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
         "PingFang SC","Microsoft YaHei",sans-serif; padding:20px; }
  .card { width:100%; max-width:420px; background:#fff; border:1px solid #e6ecf5;
          border-radius:16px; padding:28px; box-shadow:0 12px 40px rgba(20,40,80,.08); text-align:center; }
  .logo { width:48px; height:48px; margin:0 auto 14px; border-radius:12px; background:#007aff;
          color:#fff; font-size:26px; font-weight:800; line-height:48px; }
  h1 { font-size:18px; margin:0 0 8px; }
  p { font-size:13px; line-height:1.7; margin:0; color:#64748b; word-break:break-word; }
  .btn { display:inline-block; margin-top:20px; padding:10px 22px; border-radius:10px;
         background:#007aff; color:#fff; font-size:14px; font-weight:600; text-decoration:none; }
  .err { color:#b91c1c; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">K</div>
  <h1 id="title"></h1>
  <p id="msg"></p>
  <a id="back" class="btn" href="index.html" hidden></a>
</div>
<!-- 字典与 index.html 同源同版；回调页本身不进 SW 缓存，这里直接加载即可 -->
<script>var module = { exports: {} }; var exports = module.exports;</script>
<script src="i18n.js"></script>
<script>
  window.KIWI_CB_BASE = module.exports.I18N;
  module = { exports: {} }; exports = module.exports;
</script>
<script src="i18n-extra.js"></script>
<script>
  window.KIWI_CB_EXTRA = module.exports.EXTRA;
  window.KIWI_CB_CODES = module.exports.CODES;
  delete window.module; delete window.exports;
</script>
<script>
;(function () {
  'use strict'
  var $ = function (id) { return document.getElementById(id) }
  var API_KEY = 'kiwi_web_api'
  var TOKEN_KEY = 'kiwi_web_token'
  var SS_KEY = 'kiwi_oauth'
  var LANG_KEY = 'kiwi_web_lang'

  /** 与主界面共用 localStorage 里的语言选择；字典与 index.html 完全一致 */
  var BASE = window.KIWI_CB_BASE || {}
  var EXTRA = window.KIWI_CB_EXTRA || {}
  var CODES = window.KIWI_CB_CODES || []
  function pickLang() {
    var saved = lsGet(LANG_KEY)
    if (CODES.indexOf(saved) >= 0) return saved
    var nav = String((navigator.language || '').toLowerCase()).replace(/_/g, '-')
    var map = {
      'zh-tw': 'zh-TW', 'zh-hk': 'zh-TW', 'en-gb': 'en-GB', 'en-us': 'en-US',
      'ja': 'ja', 'ko': 'ko', 'de': 'de', 'fr': 'fr', 'es': 'es', 'it': 'it', 'pt-br': 'pt-BR',
    }
    return map[nav] || map[nav.slice(0, 2)] || 'zh-CN'
  }
  var lang = pickLang()
  function t(key, vars) {
    var d = Object.assign({}, BASE[lang] || {})
    Object.keys(EXTRA).forEach(function (k) {
      d[k] = (EXTRA[k] && EXTRA[k][lang]) || (EXTRA[k] && EXTRA[k]['zh-CN']) || k
    })
    var out = d[key] === undefined ? ((BASE['zh-CN'] || {})[key] || key) : d[key]
    var v = vars || {}
    return String(out).replace(/\{(\w+)\}/g, function (m, k) { return v[k] === undefined ? m : String(v[k]) })
  }

  function lsGet(k) { try { return localStorage.getItem(k) || '' } catch (e) { return '' } }
  function lsSet(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
  function ssGet(k) { try { return sessionStorage.getItem(k) || '' } catch (e) { return '' } }
  function ssDel(k) { try { sessionStorage.removeItem(k) } catch (e) {} }

  function showError(msg) {
    $('title').textContent = t('cb_fail_title')
    $('title').className = 'err'
    $('msg').textContent = msg
    $('back').hidden = false
  }

  function callApi(url, action, payload) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action: action }, payload || {})),
    }).then(function (res) {
      return res.text().then(function (text) {
        var data
        try { data = JSON.parse(text) } catch (e) { throw new Error(t('cb_api_bad', { n: res.status })) }
        // 未开启集成响应时，整个 {statusCode, headers, body} 会被当 JSON 返回
        if (data && typeof data.statusCode === 'number' && typeof data.body === 'string') {
          try { data = JSON.parse(data.body) } catch (e) {}
        }
        if (!data || !data.ok) throw new Error((data && data.message) || t('cb_cloud_fail'))
        return data
      })
    })
  }

  function run() {
    document.documentElement.lang = lang
    document.title = t('cb_title')
    $('title').textContent = t('cb_loading')
    $('msg').textContent = t('cb_checking')
    $('back').textContent = t('cb_back')
    var params = new URLSearchParams(location.search)
    var apiUrl = lsGet(API_KEY)
    var saved
    try { saved = JSON.parse(ssGet(SS_KEY) || 'null') } catch (e) { saved = null }

    if (params.get('error')) {
      showError(t('cb_cancelled', { err: params.get('error') }))
      return
    }
    if (!apiUrl) {
      showError(t('cb_no_api'))
      return
    }
    if (!saved || !saved.state || !saved.provider) {
      showError(t('cb_no_state'))
      return
    }
    if (!params.get('code')) {
      showError(t('cb_no_code'))
      return
    }
    if (params.get('state') !== saved.state) {
      showError(t('cb_bad_state'))
      return
    }
    if (!saved.at || Date.now() - saved.at > 10 * 60000) {
      showError(t('cb_timeout'))
      return
    }

    $('msg').textContent = t('cb_building')
    callApi(apiUrl, 'oauthCallback', {
      provider: saved.provider,
      code: params.get('code'),
      state: saved.state,
      verifier: saved.verifier || '',
      redirectUri: saved.redirectUri,
    }).then(function (res) {
      lsSet(TOKEN_KEY, res.token)
      ssDel(SS_KEY)
      $('title').textContent = res.linked ? t('cb_ok') : t('cb_need_link')
      $('msg').textContent = res.linked
        ? t('cb_opening')
        : t('cb_link_hint')
      location.replace('index.html?login=oauth')
    }).catch(function (e) {
      showError(e.message || t('cb_cloud_fail'))
    })
  }

  run()
})()
</script>
</body>
</html>
